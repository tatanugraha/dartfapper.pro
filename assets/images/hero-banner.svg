<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Perisai rune Ragnarok di tengah, diapit kartu-kartu Mythrix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E81CFF"/>
      <stop offset=".5" stop-color="#7B3CFF"/>
      <stop offset="1" stop-color="#14C8E8"/>
    </linearGradient>
    <linearGradient id="shard2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14C8E8"/>
      <stop offset="1" stop-color="#7B3CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B784FF" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#7B3CFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7B3CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wood" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#8A5A34"/>
      <stop offset="1" stop-color="#4A2C17"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4FA"/>
      <stop offset=".5" stop-color="#9AA3B8"/>
      <stop offset="1" stop-color="#5D6478"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset=".5" stop-color="#E0A93B"/>
      <stop offset="1" stop-color="#9C6A16"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1260"/>
      <stop offset="1" stop-color="#120A33"/>
    </linearGradient>

    <!-- satu kartu Mythrix, origin di tengah bawah -->
    <g id="card">
      <rect x="-62" y="-190" width="124" height="180" rx="10" fill="url(#gold)"/>
      <rect x="-56" y="-184" width="112" height="168" rx="7" fill="url(#cardface)"/>
      <rect x="-48" y="-176" width="96" height="98" rx="4" fill="#1B0E45" stroke="#E0A93B" stroke-width="1.5"/>
      <rect x="-48" y="-70" width="96" height="44" rx="3" fill="#0E0828" stroke="#5C3BA8" stroke-width="1"/>
      <rect x="-40" y="-62" width="62" height="5" rx="2" fill="#7C66B8"/>
      <rect x="-40" y="-52" width="74" height="5" rx="2" fill="#4F3F86"/>
      <rect x="-40" y="-42" width="48" height="5" rx="2" fill="#4F3F86"/>
      <circle cx="-44" cy="-180" r="13" fill="url(#gold)" stroke="#5A3A0A" stroke-width="1.5"/>
      <circle cx="44" cy="-24" r="13" fill="#D8263F" stroke="#5A0A16" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- shard miring khas banner esports -->
  <polygon points="80,520 230,190 420,190 300,520" fill="url(#shard)" opacity=".9"/>
  <polygon points="0,520 120,300 200,300 110,520" fill="url(#shard2)" opacity=".55"/>
  <polygon points="1120,520 970,190 780,190 900,520" fill="url(#shard)" opacity=".9"/>
  <polygon points="1200,520 1080,300 1000,300 1090,520" fill="url(#shard2)" opacity=".55"/>
  <polygon points="360,520 470,250 730,250 840,520" fill="#2B1466" opacity=".85"/>

  <circle cx="600" cy="300" r="250" fill="url(#glow)"/>

  <!-- kartu kiri -->
  <g transform="translate(330 470)">
    <g transform="rotate(-26)"><use href="#card"/><path d="M0 -150 l14 24 h-28 z M0 -100 l14 -24 h-28 z" fill="#B784FF" transform="translate(0 0)"/></g>
    <g transform="rotate(-14) translate(40 -10)">
      <use href="#card"/>
      <!-- sigil mata -->
      <path d="M-30 -127 Q0 -160 30 -127 Q0 -94 -30 -127 Z" fill="none" stroke="#FFE29A" stroke-width="3"/>
      <circle cx="0" cy="-127" r="10" fill="#14C8E8"/>
      <circle cx="0" cy="-127" r="4" fill="#120A33"/>
    </g>
  </g>

  <!-- kartu kanan -->
  <g transform="translate(870 470)">
    <g transform="rotate(26)"><use href="#card"/><circle cx="0" cy="-127" r="22" fill="none" stroke="#B784FF" stroke-width="3"/></g>
    <g transform="rotate(14) translate(-40 -10)">
      <use href="#card"/>
      <!-- sigil bulan sabit + bintang -->
      <path d="M8 -152 A28 28 0 1 0 8 -102 A22 22 0 1 1 8 -152 Z" fill="#FFE29A"/>
      <path d="M22 -132 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#14C8E8"/>
    </g>
  </g>

  <!-- pedang & kapak di belakang perisai -->
  <g transform="translate(600 300) rotate(-40)">
    <rect x="-7" y="-235" width="14" height="300" fill="url(#steel)"/>
    <polygon points="-7,-235 7,-235 0,-262" fill="#F2F4FA"/>
    <rect x="-42" y="62" width="84" height="12" rx="4" fill="url(#gold)"/>
    <rect x="-6" y="74" width="12" height="54" rx="3" fill="#3B2410"/>
    <circle cx="0" cy="134" r="9" fill="url(#gold)"/>
  </g>
  <g transform="translate(600 300) rotate(40)">
    <rect x="-6" y="-150" width="12" height="290" rx="3" fill="#5A3A1E"/>
    <path d="M6 -150 Q78 -160 92 -100 Q60 -112 6 -88 Z" fill="url(#steel)"/>
    <path d="M-6 -150 Q-48 -150 -56 -116 Q-30 -122 -6 -104 Z" fill="url(#steel)"/>
  </g>

  <!-- perisai bundar rune -->
  <g transform="translate(600 300)">
    <circle r="138" fill="url(#gold)"/>
    <circle r="126" fill="url(#wood)"/>
    <g stroke="#2E1A0C" stroke-width="3" opacity=".55">
      <line x1="-126" y1="-40" x2="126" y2="-40"/>
      <line x1="-126" y1="0" x2="126" y2="0"/>
      <line x1="-126" y1="40" x2="126" y2="40"/>
      <line x1="-110" y1="-80" x2="110" y2="-80"/>
      <line x1="-110" y1="80" x2="110" y2="80"/>
    </g>
    <circle r="104" fill="none" stroke="#E0A93B" stroke-width="3" stroke-dasharray="2 10"/>
    <circle r="92" fill="none" stroke="#B784FF" stroke-width="18" opacity=".28"/>
    <!-- huruf rune Elder Futhark melingkar -->
    <g fill="none" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(0) translate(0 -92)"><path d="M0 -9 V9 M0 -9 L7 -3 M0 -2 L7 4"/></g>
      <g transform="rotate(40) translate(0 -92)"><path d="M-4 -9 V9 M-4 -9 L5 0 L-4 9"/></g>
      <g transform="rotate(80) translate(0 -92)"><path d="M0 -9 V9 M-6 -3 L6 3"/></g>
      <g transform="rotate(120) translate(0 -92)"><path d="M-5 -9 V9 M5 -9 V9 M-5 -9 L5 9"/></g>
      <g transform="rotate(160) translate(0 -92)"><path d="M0 -9 V9 M0 -9 L7 -2 M0 -2 L-7 5"/></g>
      <g transform="rotate(200) translate(0 -92)"><path d="M-6 -9 L6 9 M6 -9 L-6 9"/></g>
      <g transform="rotate(240) translate(0 -92)"><path d="M0 -9 V9 M0 -9 L7 -2 L0 4"/></g>
      <g transform="rotate(280) translate(0 -92)"><path d="M0 -9 V9 M-6 -9 L0 -2 L6 -9"/></g>
      <g transform="rotate(320) translate(0 -92)"><path d="M-5 -9 V9 M-5 0 L5 -9 M-5 0 L5 9"/></g>
    </g>
    <!-- boss tengah -->
    <circle r="44" fill="url(#steel)" stroke="#2B2F3C" stroke-width="3"/>
    <circle r="30" fill="#1B0E45"/>
    <path d="M0 -20 L17 0 L0 20 L-17 0 Z" fill="#14C8E8"/>
    <path d="M0 -10 L8 0 L0 10 L-8 0 Z" fill="#E9FCFF"/>
    <g fill="url(#steel)">
      <circle cx="0" cy="-118" r="6"/><circle cx="0" cy="118" r="6"/>
      <circle cx="-118" cy="0" r="6"/><circle cx="118" cy="0" r="6"/>
      <circle cx="83" cy="-83" r="6"/><circle cx="-83" cy="83" r="6"/>
      <circle cx="-83" cy="-83" r="6"/><circle cx="83" cy="83" r="6"/>
    </g>
  </g>

  <!-- partikel -->
  <g fill="#E9D5FF">
    <circle cx="470" cy="110" r="3"/><circle cx="760" cy="90" r="2"/><circle cx="820" cy="160" r="3"/>
    <circle cx="380" cy="200" r="2"/><circle cx="700" cy="60" r="2.5"/><circle cx="520" cy="60" r="2"/>
  </g>
</svg>
